<div class="row">
  <div class="col-4">
    <ul>
      <li *ngFor="let item of rolesList">{{ item.role }}</li>
    </ul>
  </div>

  <div class="col-4">
    <select>
      <option *ngFor="let role of rolesList" [value]="role.roleId">{{ role.role }}</option>
    </select>
  </div>

  <div class="col-4">
    <button class="btn btn-warning mx-2" *ngFor="let item of rolesList"  >{{ item.role }}</button>
  </div>
</div>

<p>roles works!</p>

<div class="row">

  <div class="col-3">
    <p>{{ firstName }}</p>
  </div>

  <div class="col-3">
    <p>{{ angularVersion }}</p>
  </div>

  <div class="col-3">
    <p>{{ currentDate }}</p>
  </div>

  <div class="col-3">
    <p>{{ selectedState }}</p>
  </div>

</div>

<div class="row">
  <div class="col-3">
    <input type="text" [value]="firstName" class="form-control" />
  </div>

  <div class="col-3">
    <input type="text" [(ngModel)]="firstName" />
  </div>

  <div class="col-3">
    <input [type]="inputType" />
  </div>

    <div class="col-3">
      <select [(ngModel)]="selectedState">
        <option value="Pyrenne-Oriental: ---: 66">Pyrenne-Oriental</option>
        <option value="Paris: ---: 75">Paris</option>
        <option value="Isere: ---: 38">Isere</option>
        <option value="Alpes-Maritimes: ---: 06">Alpes-Maritimes</option>
      </select>
    </div>
</div>

<div class="row">
  <div class="col-3">
    <button class="btn btn-success" (click)="showWelcomeAlert()">Show Welcome Alert</button>
  </div>

  <div class="col-3">
    <button class="btn btn-success" (click)="showMessage('Welcome React')">Show React Message</button>
  </div>

  <div class="col-3">
    <button class="btn btn-success" (click)="showMessage('Welcome Dot Net')">Show Dot Net Message</button>
  </div>


</div>
